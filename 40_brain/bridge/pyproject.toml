[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-bridge"
version = "0.1.0"
description = "Serial bridge between the Otto brain (Jetson) and the spine (RP2040)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
camera = ["opencv-python-headless>=4.8"]

[project.scripts]
otto-bridge = "otto_bridge.cli:main"

[tool.setuptools]
packages = ["otto_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
